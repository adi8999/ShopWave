# /etc/nginx/sites-available/shopwave
# Reference copy — managed by deploy/setup_ec2.sh
# Replace YOUR_DOMAIN with your actual domain (e.g. shopwave.example.com)

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Serve the built React app
    root /var/www/shopwave;
    index index.html;

    # React Router — send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/ -> FastAPI backend on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# After running: sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# Certbot will add a server {} block here for port 443 with TLS config.
